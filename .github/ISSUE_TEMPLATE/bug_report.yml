name: Bug report
description: Something is wrong, inaccurate or unsafe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Safety or security problem (e.g. something deleted outside an approved location)? Please use **Security → Report a vulnerability** instead of a public issue."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or screen, what you expected, and what you saw.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: "MacBook Air M4, macOS 26.1"
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: MacPulse version (`macpulse version`)
  - type: textarea
    id: doctor
    attributes:
      label: "`macpulse doctor` output"
      description: Review before posting.
      render: text
