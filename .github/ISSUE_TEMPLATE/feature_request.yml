name: Feature request
description: Suggest a metric, view, cleanup rule or CLI command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: source
    attributes:
      label: Data source / API
      description: For new metrics, which supported macOS interface provides it? MacPulse does not use private APIs or root.
